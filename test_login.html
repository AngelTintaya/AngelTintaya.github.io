<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Login de Prueba</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }
    .container {
      max-width: 400px;
      margin: auto;
    }
    label, select {
      display: block;
      margin-top: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    table, th, td {
      border: 1px solid #bbb;
    }
    th, td {
      padding: 8px;
      text-align: left;
    }
    #recordsSection {
      margin-top: 20px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container" id="loginSection">
    <h2>Ingreso</h2>
    <label for="username">Usuario:</label>
    <input type="text" id="username" />

    <label for="password">Contraseña:</label>
    <input type="password" id="password" />

    <button id="loginBtn">Ingresar</button>
  </div>

  <div class="container" id="optionsSection" style="display: none;">
    <h2>Seleccione cuántos registros ver</h2>
    <select id="recordCount">
      <option value="" disabled selected>Seleccione...</option>
      <option value="1">1 registro</option>
      <option value="2">2 registros</option>
      <option value="3">3 registros</option>
      <option value="4">4 registros</option>
      <option value="5">5 registros</option>
    </select>
  </div>

  <div class="container" id="recordsSection">
    <h2>Registros</h2>
    <table id="recordsTable">
      <thead>
        <tr><th>ID</th><th>Nombre</th><th>Valor</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    // Datos de ejemplo para la tabla
    const allData = [
      {id: 1, nombre: "Producto A", valor: "100"},
      {id: 2, nombre: "Producto B", valor: "200"},
      {id: 3, nombre: "Producto C", valor: "300"},
      {id: 4, nombre: "Producto D", valor: "400"},
      {id: 5, nombre: "Producto E", valor: "500"}
    ];

    const loginBtn = document.getElementById("loginBtn");
    const loginSection = document.getElementById("loginSection");
    const optionsSection = document.getElementById("optionsSection");
    const recordsSection = document.getElementById("recordsSection");
    const recordCount = document.getElementById("recordCount");
    const recordsTableBody = document.querySelector("#recordsTable tbody");

    // 1) Simulación de login
    loginBtn.addEventListener("click", () => {
      // Ocultamos login
      loginSection.style.display = "none";

      // Luego de 2 segundos, mostramos el select
      setTimeout(() => {
        optionsSection.style.display = "block";
      }, 2000);
    });

    // 2) Al elegir cuántos registros mostrar
    recordCount.addEventListener("change", () => {
      const count = parseInt(recordCount.value, 10);

      // Ocultamos tabla si estuviera visible
      recordsSection.style.display = "none";

      // Después de 3 segundos, mostramos la tabla con N registros
      setTimeout(() => {
        // Limpiamos el tbody
        recordsTableBody.innerHTML = "";
        // Agregamos los primeros N registros
        allData.slice(0, count).forEach(item => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${item.id}</td>
            <td>${item.nombre}</td>
            <td>${item.valor}</td>
          `;
          recordsTableBody.appendChild(row);
        });

        // Mostramos la sección de la tabla
        recordsSection.style.display = "block";
      }, 3000);
    });
  </script>
</body>
</html>
